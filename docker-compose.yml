services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_agent}
      POSTGRES_USER: ${POSTGRES_USER:-shop_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    # 命名数据卷会在应用容器重建或重启后保留数据库数据。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://shop_agent:change-me@db:5432/shop_agent}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH:-/models/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${API_PORT:-8000}:8000"
    # API 迁移和启动需等待 PostgreSQL 已接受连接。
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 模型文件由宿主机手动下载并挂载，容器运行时不请求外部嵌入服务。
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  model-download:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      LOCAL_EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
    # 该一次性工具服务使用可写挂载；API 服务始终以只读方式读取模型文件。
    volumes:
      - ./models:/models
    command: ["python", "-m", "app.download_embedding_model"]

volumes:
  postgres_data:
