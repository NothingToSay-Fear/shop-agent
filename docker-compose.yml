services:
  db:
    # pgvector 让 PostgreSQL 能用 HNSW 索引完成知识库向量候选召回。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_agent}
      POSTGRES_USER: ${POSTGRES_USER:-shop_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    # 命名数据卷会在应用容器重建或重启后保留数据库数据。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://shop_agent:change-me@db:5432/shop_agent}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH:-/models/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      LOCAL_RERANKER_MODEL_PATH: ${LOCAL_RERANKER_MODEL_PATH:-/models/bge-reranker-base}
      LOCAL_RERANKER_MODEL_ID: ${LOCAL_RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
      LOCAL_RERANKER_DEVICE: ${LOCAL_RERANKER_DEVICE:-cpu}
      KNOWLEDGE_RERANKER_MIN_SCORE: ${KNOWLEDGE_RERANKER_MIN_SCORE:-0.35}
      RAG_QUERY_EXPANSION_MAX_QUERIES: ${RAG_QUERY_EXPANSION_MAX_QUERIES:-2}
      KNOWLEDGE_UPLOAD_DIR: ${KNOWLEDGE_UPLOAD_DIR:-/uploads}
      KNOWLEDGE_MAX_UPLOAD_SIZE_MB: ${KNOWLEDGE_MAX_UPLOAD_SIZE_MB:-20}
      KNOWLEDGE_INDEX_BATCH_SIZE: ${KNOWLEDGE_INDEX_BATCH_SIZE:-32}
      KNOWLEDGE_CHUNK_SEMANTIC_SIMILARITY_THRESHOLD: ${KNOWLEDGE_CHUNK_SEMANTIC_SIMILARITY_THRESHOLD:-0.55}
      KNOWLEDGE_INDEX_POLL_SECONDS: ${KNOWLEDGE_INDEX_POLL_SECONDS:-1}
      KNOWLEDGE_INDEX_MAX_ATTEMPTS: ${KNOWLEDGE_INDEX_MAX_ATTEMPTS:-3}
      CONVERSATION_SUMMARY_POLL_SECONDS: ${CONVERSATION_SUMMARY_POLL_SECONDS:-1}
      CONVERSATION_SUMMARY_MAX_ATTEMPTS: ${CONVERSATION_SUMMARY_MAX_ATTEMPTS:-3}
      CONVERSATION_SUMMARY_LEASE_SECONDS: ${CONVERSATION_SUMMARY_LEASE_SECONDS:-300}
      CONVERSATION_MEMORY_TOKEN_BUDGET: ${CONVERSATION_MEMORY_TOKEN_BUDGET:-12000}
      CONVERSATION_MEMORY_COMPACT_THRESHOLD: ${CONVERSATION_MEMORY_COMPACT_THRESHOLD:-9600}
      CONVERSATION_MEMORY_RECENT_MESSAGE_LIMIT: ${CONVERSATION_MEMORY_RECENT_MESSAGE_LIMIT:-10}
      CONVERSATION_MEMORY_TURN_TEXT_LIMIT: ${CONVERSATION_MEMORY_TURN_TEXT_LIMIT:-2000}
      CONVERSATION_SUMMARY_LLM_TEXT_LIMIT: ${CONVERSATION_SUMMARY_LLM_TEXT_LIMIT:-1200}
      CONVERSATION_SUMMARY_FALLBACK_TEXT_LIMIT: ${CONVERSATION_SUMMARY_FALLBACK_TEXT_LIMIT:-2400}
      USER_MEMORY_FOCUS_DIRECTION_TTL_DAYS: ${USER_MEMORY_FOCUS_DIRECTION_TTL_DAYS:-90}
      USER_MEMORY_MAX_ACTIVE_RECORDS: ${USER_MEMORY_MAX_ACTIVE_RECORDS:-50}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-10}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-7}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${API_PORT:-8000}:8000"
    # API 迁移和启动需等待 PostgreSQL 已接受连接。
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 模型文件由宿主机手动下载并挂载，容器运行时不请求外部嵌入服务。
      - ./models:/models:ro
      # 原始知识库文件必须持久化，容器重建后才能继续预览和下载。
      - ./uploads:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  knowledge-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://shop_agent:change-me@db:5432/shop_agent}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH:-/models/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      KNOWLEDGE_INDEX_BATCH_SIZE: ${KNOWLEDGE_INDEX_BATCH_SIZE:-32}
      KNOWLEDGE_CHUNK_SEMANTIC_SIMILARITY_THRESHOLD: ${KNOWLEDGE_CHUNK_SEMANTIC_SIMILARITY_THRESHOLD:-0.55}
      KNOWLEDGE_INDEX_POLL_SECONDS: ${KNOWLEDGE_INDEX_POLL_SECONDS:-1}
      KNOWLEDGE_INDEX_MAX_ATTEMPTS: ${KNOWLEDGE_INDEX_MAX_ATTEMPTS:-3}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
      - ./uploads:/uploads:ro
    command: ["python", "-m", "app.knowledge_worker"]

  conversation-summary-worker:
    # 会话摘要不占用流式问答请求；Worker 从 PostgreSQL 领取排队任务并异步压缩历史讨论。
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://shop_agent:change-me@db:5432/shop_agent}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOCAL_EMBEDDING_MODEL_PATH: ${LOCAL_EMBEDDING_MODEL_PATH:-/models/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      CONVERSATION_SUMMARY_POLL_SECONDS: ${CONVERSATION_SUMMARY_POLL_SECONDS:-1}
      CONVERSATION_SUMMARY_MAX_ATTEMPTS: ${CONVERSATION_SUMMARY_MAX_ATTEMPTS:-3}
      CONVERSATION_SUMMARY_LEASE_SECONDS: ${CONVERSATION_SUMMARY_LEASE_SECONDS:-300}
      CONVERSATION_MEMORY_TOKEN_BUDGET: ${CONVERSATION_MEMORY_TOKEN_BUDGET:-12000}
      CONVERSATION_MEMORY_COMPACT_THRESHOLD: ${CONVERSATION_MEMORY_COMPACT_THRESHOLD:-9600}
      CONVERSATION_MEMORY_RECENT_MESSAGE_LIMIT: ${CONVERSATION_MEMORY_RECENT_MESSAGE_LIMIT:-10}
      CONVERSATION_MEMORY_TURN_TEXT_LIMIT: ${CONVERSATION_MEMORY_TURN_TEXT_LIMIT:-2000}
      CONVERSATION_SUMMARY_LLM_TEXT_LIMIT: ${CONVERSATION_SUMMARY_LLM_TEXT_LIMIT:-1200}
      CONVERSATION_SUMMARY_FALLBACK_TEXT_LIMIT: ${CONVERSATION_SUMMARY_FALLBACK_TEXT_LIMIT:-2400}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
    command: ["python", "-m", "app.conversation_summary_worker"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  model-download:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      LOCAL_EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_RERANKER_MODEL_PATH: /models/bge-reranker-base
      LOCAL_RERANKER_MODEL_ID: ${LOCAL_RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
    # 该一次性工具服务使用可写挂载；API 服务始终以只读方式读取模型文件。
    volumes:
      - ./models:/models
    command: ["python", "-m", "app.download_embedding_model"]

  evaluation-db:
    # 评测库与业务库完全隔离，允许评测脚本反复重建固定语料而不影响用户数据。
    image: pgvector/pgvector:pg16
    profiles: ["evaluation"]
    environment:
      POSTGRES_DB: shop_agent_evaluation
      POSTGRES_USER: shop_agent
      POSTGRES_PASSWORD: change-me
    volumes:
      - evaluation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  evaluation:
    # 真实评测使用同一后端镜像、解析器、pgvector HNSW、GIN、RRF 与精排模型。
    build:
      context: ./backend
    profiles: ["evaluation"]
    environment:
      DATABASE_URL: postgresql+asyncpg://shop_agent:change-me@evaluation-db:5432/shop_agent_evaluation
      LOCAL_EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      LOCAL_EMBEDDING_MODEL_ID: ${LOCAL_EMBEDDING_MODEL_ID:-BAAI/bge-small-zh-v1.5}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      LOCAL_RERANKER_MODEL_PATH: /models/bge-reranker-base
      LOCAL_RERANKER_MODEL_ID: ${LOCAL_RERANKER_MODEL_ID:-BAAI/bge-reranker-base}
      LOCAL_RERANKER_DEVICE: ${LOCAL_RERANKER_DEVICE:-cpu}
      KNOWLEDGE_RERANKER_MIN_SCORE: ${KNOWLEDGE_RERANKER_MIN_SCORE:-0.35}
      RAG_QUERY_EXPANSION_MAX_QUERIES: 0
    depends_on:
      evaluation-db:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
      # 仅 --write-baseline 会改写该版本化数据集中的 baseline.json。
      - ./backend/evaluation:/app/evaluation
      - ./evaluation-reports:/reports
    command: ["sh", "-c", "alembic upgrade head && python -m app.evaluate_rag --prepare --output-dir /reports"]

volumes:
  postgres_data:
  evaluation_postgres_data:
